name: poll-sources

on:
  schedule:
    # 08:00, 14:00, 20:00 Amsterdam (UTC+2 in summer). Crons are in UTC.
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip Telegram + git push"
        type: boolean
        default: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout knowledge_mngmnt
        uses: actions/checkout@v4
        with:
          path: knowledge_mngmnt

      - name: Checkout second-brain
        uses: actions/checkout@v4
        with:
          repository: artsteff/second-brain
          path: second-brain
          ssh-key: ${{ secrets.SECOND_BRAIN_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: knowledge_mngmnt/requirements.txt

      - name: Install yt-dlp + ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp

      - name: Install Python deps
        run: pip install -r knowledge_mngmnt/requirements.txt

      - name: Configure git
        run: |
          git -C knowledge_mngmnt config user.name "Knowledge Mgmt Bot"
          git -C knowledge_mngmnt config user.email "bot@users.noreply.github.com"
          git -C second-brain     config user.name "Knowledge Mgmt Bot"
          git -C second-brain     config user.email "bot@users.noreply.github.com"

      - name: Materialize YouTube cookies (if provided)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            mkdir -p /tmp/yt
            printf '%s' "$YOUTUBE_COOKIES" > /tmp/yt/cookies.txt
            chmod 600 /tmp/yt/cookies.txt
            if head -1 /tmp/yt/cookies.txt | grep -q "Netscape"; then
              echo "Cookies file looks valid ($(wc -l < /tmp/yt/cookies.txt) lines)."
            else
              echo "::warning::YOUTUBE_COOKIES does not start with the Netscape header — may not work."
            fi
          else
            echo "No YOUTUBE_COOKIES secret set; proceeding without cookies."
          fi

      - name: Run orchestrator
        working-directory: knowledge_mngmnt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_CAPTURE_BOT_TOKEN: ${{ secrets.TELEGRAM_CAPTURE_BOT_TOKEN }}
          TELEGRAM_CAPTURE_CHANNEL_ID: ${{ secrets.TELEGRAM_CAPTURE_CHANNEL_ID }}
          SECOND_BRAIN_PATH: ${{ github.workspace }}/second-brain
          YT_COOKIES_FILE: /tmp/yt/cookies.txt
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m pipeline.orchestrator --from-config --dry-run
          else
            python -m pipeline.orchestrator --from-config
          fi
